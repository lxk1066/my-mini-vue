<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vue3 test</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- <script type="module" src="./index.js"></script> -->
    <script type="module">
      import { createApp, h, reactive } from "./index.js";

      const obj = reactive({
        count: 0
      });
      const app = {
        render() {
          return h("div", { id: "container" }, [
            h(
              "h1",
              {
                style: `color: ${obj.count > 3 ? "red" : "green"}`
              },
              "Vue3"
            ),
            h("p", { class: "content" }, obj.count),
            h(
              "button",
              {
                onClick() {
                  obj.count++;
                }
              },
              "加一"
            )
          ]);
        }
      };
      createApp(app, document.getElementById("app"));
    </script>
  </body>
</html>
